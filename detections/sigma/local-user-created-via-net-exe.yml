# Local User Created Via Net.EXE
#
# ATT&CK:  T1136.001 Create Account: Local Account
# Tested:  Atomic Red Team T1136.001 test 4 on a Windows Server 2022 endpoint
#          (Sysmon, Olaf Hartong config -> Elastic Agent -> Security Onion).
#          Run alerts: 2 alerts per run (net.exe and its child net1.exe).
#          Cleanup (net user /del) does not alert. Confirmed on repeat runs.
# Notes:   One action produces two alerts because net.exe spawns net1.exe.
#          Deployed as a custom Sigma rule in Security Onion (ElastAlert).

title: Local User Created Via Net.EXE
id: 7e2c4b1a-9f3d-4c8e-a6b2-5d1f0e9c3a74
status: experimental
description: Detects creation of a local user account using net.exe or net1.exe (net user /add).
author: James
date: 2026-09-27
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        - OriginalFileName:
            - 'net.exe'
            - 'net1.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'user'
            - '/ad'
    condition: all of selection_*
falsepositives:
    - Legitimate admin account creation
level: medium
